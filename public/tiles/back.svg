<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 108" width="100" height="108">
  <title>가려진 타일</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#faf9f5"/>
      <stop offset="1" stop-color="#ebe6db"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset="0.3" stop-color="#fa7e1e"/>
      <stop offset="0.6" stop-color="#d62976"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
  </defs>
  <!-- 타일 옆면 -->
  <rect x="1" y="8" width="98" height="99" rx="17" fill="#d3ccbb"/>
  <!-- 타일 윗면 -->
  <rect x="1" y="1" width="98" height="99" rx="17" fill="url(#back)" stroke="none" stroke-width="1.5"/>
  <text x="50" y="66" text-anchor="middle" font-family="Georgia, 'Noto Serif', 'Times New Roman', serif" font-weight="700" font-size="44" letter-spacing="-3" fill="rgba(255,255,255,0.9)">16</text>
</svg>
